name: Create v0.5.1 tag
on:
  push:
    branches: [release-tag/v0.5.1]
jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0.5.1 -f sha=0a458fee1cc750de5eed146655514c6591c27791 --jq .ref
